name: Ubuntu Cloud SSH

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SSH_USERNAME: "ubuntuadmin"
      SSH_PASSWORD: "P@ssw0rd123!" # بهتر است در Secrets قرار گیرد ولی در صورت ثابت بودن ماسک می‌شود

    steps:

      # ==========================================================
      # 1. Prepare Ubuntu & Mask Secrets
      # ==========================================================
      - name: 1. Prepare Ubuntu
        shell: bash
        run: |
          set -e
          # Mask password from appearing in raw GitHub logs
          echo "::add-mask::$SSH_PASSWORD"

          echo "=========================================="
          echo "Preparing Ubuntu..."
          echo "=========================================="

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            curl \
            ufw \
            ca-certificates \
            iproute2 \
            net-tools

          echo "Ubuntu and Kernel info:"
          cat /etc/os-release | grep PRETTY_NAME
          uname -a


      # ==========================================================
      # 2. Create SSH User + Sudo Permissions
      # ==========================================================
      - name: 2. Create SSH User
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Creating SSH user..."
          echo "=========================================="

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
              sudo useradd \
                --create-home \
                --shell /bin/bash \
                "$SSH_USERNAME"
          fi

          sudo usermod -aG sudo "$SSH_USERNAME"
          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd
          sudo chage -M 99999 "$SSH_USERNAME"

          # Give sudo rights without password prompt for convenience
          echo "$SSH_USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/90-cloud-user > /dev/null
          sudo chmod 0440 /etc/sudoers.d/90-cloud-user

          echo "User $SSH_USERNAME created successfully."


      # ==========================================================
      # 3. Configure SSH (First-match Priority)
      # ==========================================================
      - name: 3. Configure OpenSSH
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Configuring OpenSSH..."
          echo "=========================================="

          sudo mkdir -p /etc/ssh/sshd_config.d

          # Using 00-* ensures this configuration takes precedence over others
          sudo tee /etc/ssh/sshd_config.d/00-cloud-server.conf > /dev/null <<'EOF'
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication yes
          PermitRootLogin no
          UsePAM yes
          X11Forwarding no
          AllowUsers ubuntuadmin
          ClientAliveInterval 60
          ClientAliveCountMax 10
          EOF

          # Validate SSH config
          sudo sshd -t

          # Handle both systemd service & socket (Ubuntu 22/24 compatibility)
          sudo systemctl daemon-reload
          sudo systemctl restart ssh || sudo systemctl restart ssh.service || true
          if systemctl list-unit-files | grep -q "ssh.socket"; then
              sudo systemctl restart ssh.socket || true
          fi

          echo "Listening SSH ports:"
          sudo ss -tlnp | grep ':22' || true


      # ==========================================================
      # 4. Install Tailscale
      # ==========================================================
      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTHKEY" ]; then
              echo "ERROR: TAILSCALE_AUTHKEY is empty in Secrets!"
              exit 1
          fi

          echo "=========================================="
          echo "Installing Tailscale..."
          echo "=========================================="

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable tailscaled
          sudo systemctl restart tailscaled
          sleep 3

          echo "Connecting to Tailscale..."
          # --reset clears previous ephemeral conflicts
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-ubuntu-server" \
            --reset

          sleep 5
          sudo tailscale status


      # ==========================================================
      # 5. Configure Firewall
      # ==========================================================
      - name: 5. Configure UFW Firewall
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Configuring UFW..."
          echo "=========================================="

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # Allow Tailscale WireGuard Direct Port (improves speed / P2P)
          sudo ufw allow 41641/udp || true

          # Allow SSH on Tailscale interface
          sudo ufw allow in on tailscale0 to any port 22 proto tcp

          sudo ufw --force enable
          sudo ufw status verbose


      # ==========================================================
      # 6. Test SSH User & Port
      # ==========================================================
      - name: 6. Test SSH Configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Testing SSH configuration..."
          echo "=========================================="

          id "$SSH_USERNAME"

          if ! sudo ss -tln | grep -q ':22'; then
              echo "ERROR: SSH is not listening on port 22."
              exit 1
          fi

          echo "SSH configuration verified."


      # ==========================================================
      # 7. Get Tailscale IP + Server Information
      # ==========================================================
      - name: 7. Show Server Information
        shell: bash
        run: |
          set -e

          TAILSCALE_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TAILSCALE_IP" ]; then
              echo "ERROR: Could not get Tailscale IPv4."
              exit 1
          fi

          echo ""
          echo "======================================================"
          echo "              UBUNTU SERVER IS READY"
          echo "======================================================"
          echo "Hostname       : $(hostname)"
          echo "CPU Cores      : $(nproc)"
          echo "Memory (RAM)   : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk Free      : $(df -h / | awk 'NR==2 {print $4}')"
          echo "Tailscale IPv4 : $TAILSCALE_IP"
          echo "SSH Username   : $SSH_USERNAME"
          echo "SSH Password   : $SSH_PASSWORD"
          echo "SSH Command    : ssh $SSH_USERNAME@$TAILSCALE_IP"
          echo "======================================================"


      # ==========================================================
      # 8. Keep Server Alive + Health Check
      # ==========================================================
      - name: 8. Keep Ubuntu Server Alive
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "Ubuntu server is running..."
          echo "=========================================="

          # 340 minutes loop
          for i in $(seq 1 340); do

              CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
              echo "[$i/340] [$CURRENT_TIME] Health Check..."

              # ---------------- SSH Check ----------------
              if ! sudo ss -tln | grep -q ':22'; then
                  echo "SSH is down. Restarting..."
                  sudo systemctl restart ssh || sudo systemctl restart ssh.service || true
              fi

              # ------------- Tailscale Check -------------
              if ! sudo tailscale status >/dev/null 2>&1; then
                  echo "Tailscale down. Restarting tailscaled..."
                  sudo systemctl restart tailscaled || true
                  sleep 3
                  sudo tailscale up || true
              fi

              sleep 60
          done

          echo "Keep-alive finished."
