name: Ubuntu Cloud SSH

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. Prepare Ubuntu
      # ==========================================================
      - name: 1. Prepare Ubuntu
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Preparing Ubuntu..."
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            curl \
            ufw \
            ca-certificates \
            iproute2 \
            net-tools

          echo
          echo "Ubuntu version:"
          grep PRETTY_NAME /etc/os-release || true

          echo
          echo "Kernel:"
          uname -a

      # ==========================================================
      # 2. Create SSH User
      # ==========================================================
      - name: 2. Create SSH User
        shell: bash
        run: |
          set -e

          USERNAME="ubuntuadmin"
          PASSWORD="P@ssw0rd123!"

          echo "=========================================="
          echo "Creating SSH user..."
          echo "=========================================="

          # Create user if it doesn't already exist
          if ! id "$USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          # Add user to sudo group
          sudo usermod -aG sudo "$USERNAME"

          # Set password
          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          # Prevent password expiration
          sudo chage -M 99999 "$USERNAME"

          echo "User created successfully."

      # ==========================================================
      # 3. Configure OpenSSH
      # ==========================================================
      - name: 3. Configure OpenSSH
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Configuring OpenSSH..."
          echo "=========================================="

          # IMPORTANT:
          # GitHub Ubuntu runners may not have /run/sshd
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          # Make sure SSH config directory exists
          sudo mkdir -p /etc/ssh/sshd_config.d

          # Create custom SSH configuration
          sudo tee /etc/ssh/sshd_config.d/99-cloud-server.conf > /dev/null <<'EOF'
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication no
          PermitRootLogin no
          UsePAM yes
          X11Forwarding no
          AllowUsers ubuntuadmin
          ClientAliveInterval 60
          ClientAliveCountMax 10
          EOF

          echo "Testing SSH configuration..."

          # Validate sshd configuration
          sudo sshd -t

          echo "SSH configuration is valid."

          # Enable SSH service
          sudo systemctl enable ssh

          # Start/restart SSH
          sudo systemctl restart ssh

          echo
          echo "SSH service:"
          sudo systemctl is-active ssh

          echo
          echo "SSH listening port:"
          sudo ss -tlnp | grep ':22' || true

          echo
          echo "OpenSSH configured successfully."

      # ==========================================================
      # 4. Install Tailscale
      # ==========================================================
      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY is empty."
            echo
            echo "Create this GitHub Actions secret:"
            echo "TAILSCALE_AUTHKEY"
            exit 1
          fi

          echo "=========================================="
          echo "Installing Tailscale..."
          echo "=========================================="

          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # Enable service
          sudo systemctl enable --now tailscaled

          echo "Waiting for tailscaled..."
          sleep 5

          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-ubuntu-server"

          sleep 5

          echo
          echo "Tailscale status:"
          sudo tailscale status

      # ==========================================================
      # 5. Configure Firewall
      # ==========================================================
      - name: 5. Configure UFW Firewall
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Configuring UFW..."
          echo "=========================================="

          # Default policies
          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # SSH is allowed ONLY through Tailscale
          sudo ufw allow in on tailscale0 to any port 22 proto tcp

          # Enable firewall
          sudo ufw --force enable

          echo
          echo "UFW status:"
          sudo ufw status verbose

      # ==========================================================
      # 6. Final Server Check
      # ==========================================================
      - name: 6. Final Server Check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Performing final checks..."
          echo "=========================================="

          # Make sure /run/sshd still exists
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          # SSH check
          if ! systemctl is-active --quiet ssh; then
            echo "SSH is not active."
            sudo systemctl restart ssh
          fi

          # Tailscale check
          if ! sudo tailscale status >/dev/null 2>&1; then
            echo "Tailscale is not connected."
            exit 1
          fi

          # Get Tailscale IPv4
          TAILSCALE_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IPv4."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "        UBUNTU SERVER IS READY"
          echo "=============================================="
          echo
          echo "Operating System:"
          grep PRETTY_NAME /etc/os-release | cut -d= -f2- | tr -d '"'
          echo
          echo "Hostname:"
          hostname
          echo
          echo "CPU Cores:"
          nproc
          echo
          echo "Memory:"
          free -h
          echo
          echo "Disk:"
          df -h /
          echo
          echo "Tailscale IPv4:"
          echo "$TAILSCALE_IP"
          echo
          echo "SSH Username:"
          echo "ubuntuadmin"
          echo
          echo "SSH Password:"
          echo "P@ssw0rd123!"
          echo
          echo "SSH Command:"
          echo "ssh ubuntuadmin@$TAILSCALE_IP"
          echo
          echo "=============================================="

      # ==========================================================
      # 7. Keep Server Alive
      # ==========================================================
      - name: 7. Keep Ubuntu Server Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "Ubuntu server is running..."
          echo "=========================================="

          # Stay alive for approximately 5h 40m.
          # Workflow timeout is 6 hours.
          for i in $(seq 1 340); do

            echo
            echo "------------------------------------------"
            echo "[$i/340] Health Check"
            echo "------------------------------------------"

            echo "Time:"
            date '+%Y-%m-%d %H:%M:%S'

            # ----------------------------------------------------
            # Ensure sshd runtime directory exists
            # ----------------------------------------------------
            if [ ! -d /run/sshd ]; then
              echo "/run/sshd missing. Creating it..."
              sudo mkdir -p /run/sshd
              sudo chmod 755 /run/sshd
            fi

            # ----------------------------------------------------
            # Check SSH
            # ----------------------------------------------------
            if systemctl is-active --quiet ssh; then
              echo "SSH: OK"
            else
              echo "SSH: DOWN"
              echo "Restarting SSH..."

              sudo mkdir -p /run/sshd
              sudo chmod 755 /run/sshd

              sudo systemctl restart ssh || true
            fi

            # ----------------------------------------------------
            # Check Tailscale
            # ----------------------------------------------------
            if sudo tailscale status >/dev/null 2>&1; then
              echo "Tailscale: OK"
            else
              echo "Tailscale: DOWN"
              echo "Attempting Tailscale reconnect..."

              sudo systemctl restart tailscaled || true

              sleep 5

              sudo tailscale up \
                --authkey="$TAILSCALE_AUTHKEY" \
                --hostname="github-ubuntu-server" || true
            fi

            # ----------------------------------------------------
            # Get current Tailscale IP
            # ----------------------------------------------------
            TAILSCALE_IP=$(sudo tailscale ip -4 2>/dev/null | head -n 1 || true)

            if [ -n "$TAILSCALE_IP" ]; then
              echo "Tailscale IP: $TAILSCALE_IP"
            else
              echo "Tailscale IP: unavailable"
            fi

            # ----------------------------------------------------
            # Disk usage
            # ----------------------------------------------------
            echo
            echo "Disk:"
            df -h / | tail -n 1

            # ----------------------------------------------------
            # Memory usage
            # ----------------------------------------------------
            echo
            echo "Memory:"
            free -h | head -n 2

            # ----------------------------------------------------
            # Wait one minute
            # ----------------------------------------------------
            sleep 60

          done

          echo
          echo "=========================================="
          echo "Keep-alive period finished."
          echo "=========================================="
